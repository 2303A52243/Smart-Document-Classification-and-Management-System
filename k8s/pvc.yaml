apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-doc-uploads-pvc
  labels:
    app: smart-doc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
