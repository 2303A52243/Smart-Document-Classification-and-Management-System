apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: smart-doc
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-doc
      component: backend
  template:
    metadata:
      labels:
        app: smart-doc
        component: backend
    spec:
      containers:
        - name: backend
          image: smart-doc-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: smart-doc-config
            - secretRef:
                name: smart-doc-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1.5Gi"
              cpu: "1500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: uploads-storage
              mountPath: /app/uploads
      volumes:
        - name: uploads-storage
          persistentVolumeClaim:
            claimName: smart-doc-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: smart-doc
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: smart-doc
    component: backend
