# Template for Kubernetes Secret.
# For production or local evaluation, create with:
# kubectl create secret generic smart-doc-secret \
#   --from-literal=JWT_SECRET_KEY='your-32-char-secure-random-jwt-secret' \
#   --from-literal=MONGODB_URL='mongodb://mongodb-service:27017'

apiVersion: v1
kind: Secret
metadata:
  name: smart-doc-secret
  labels:
    app: smart-doc
type: Opaque
stringData:
  JWT_SECRET_KEY: "change-this-production-jwt-secret-key-min-32-chars"
  MONGODB_URL: "mongodb://mongodb-service:27017"

